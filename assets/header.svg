<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jie Yao · 姚洁 — AI × Plant Genomics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#0f1b3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="strandA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono","Fira Code","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
      .sans { font-family: Inter,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Helvetica,Arial,sans-serif; }
      .cjk  { font-family: "PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Hiragino Sans GB",sans-serif; }
      .node { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .node.d1 { animation-delay: .4s } .node.d2 { animation-delay: .9s } .node.d3 { animation-delay: 1.4s } .node.d4 { animation-delay: 1.9s }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(1) } 50% { opacity:1; transform:scale(1.35) } }
      .flow { stroke-dasharray: 6 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="900" cy="160" r="230" fill="url(#glow)"/>

  <!-- top code line -->
  <text x="56" y="62" class="mono" font-size="13" fill="#64748b">// postdoc @ Schmitz Lab · University of Georgia</text>

  <!-- name -->
  <text x="54" y="138" class="sans" font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#title)">Jie Yao</text>
  <text x="318" y="138" class="cjk" font-size="44" font-weight="600" fill="#e2e8f0" opacity="0.92">姚洁</text>

  <!-- tagline -->
  <text x="56" y="182" class="sans" font-size="21" font-weight="500" fill="#cbd5e1">AI × Plant Genomics</text>
  <text x="56" y="212" class="sans" font-size="15" fill="#94a3b8">Deep learning for plant epigenomes · Single-cell &amp; spatial multi-omics</text>
  <text x="56" y="236" class="cjk" font-size="14" fill="#7c8aa5">深度学习 × 植物表观基因组 · 单细胞与空间多组学</text>

  <!-- prompt line -->
  <text x="56" y="282" class="mono" font-size="13" fill="#34d399">$</text>
  <text x="72" y="282" class="mono" font-size="13" fill="#94a3b8">peagent predict --species maize --seq ATCG…</text>
  <rect x="398" y="271" width="8" height="14" fill="#34d399" class="blink"/>

  <!-- DNA double helix (right side) -->
  <g transform="translate(700,8) scale(0.95)">
    <!-- strand A -->
    <path d="M0 160 C 40 60, 80 60, 120 160 S 200 260, 240 160 S 320 60, 360 160 S 440 260, 480 160" fill="none" stroke="url(#strandA)" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>
    <!-- strand B (phase-shifted) -->
    <path d="M0 160 C 40 260, 80 260, 120 160 S 200 60, 240 160 S 320 260, 360 160 S 440 60, 480 160" fill="none" stroke="url(#strandB)" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>
    <!-- animated flow overlay -->
    <path d="M0 160 C 40 60, 80 60, 120 160 S 200 260, 240 160 S 320 60, 360 160 S 440 260, 480 160" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" class="flow"/>
    <path d="M0 160 C 40 260, 80 260, 120 160 S 200 60, 240 160 S 320 260, 360 160 S 440 60, 480 160" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" class="flow"/>
    <!-- base-pair rungs -->
    <g stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="30"  y1="98"  x2="30"  y2="222" stroke="#22d3ee"/>
      <line x1="60"  y1="86"  x2="60"  y2="234" stroke="#8b5cf6"/>
      <line x1="90"  y1="98"  x2="90"  y2="222" stroke="#34d399"/>
      <line x1="150" y1="222" x2="150" y2="98"  stroke="#8b5cf6"/>
      <line x1="180" y1="234" x2="180" y2="86"  stroke="#22d3ee"/>
      <line x1="210" y1="222" x2="210" y2="98"  stroke="#34d399"/>
      <line x1="270" y1="98"  x2="270" y2="222" stroke="#34d399"/>
      <line x1="300" y1="86"  x2="300" y2="234" stroke="#22d3ee"/>
      <line x1="330" y1="98"  x2="330" y2="222" stroke="#8b5cf6"/>
      <line x1="390" y1="222" x2="390" y2="98"  stroke="#22d3ee"/>
      <line x1="420" y1="234" x2="420" y2="86"  stroke="#34d399"/>
      <line x1="450" y1="222" x2="450" y2="98"  stroke="#8b5cf6"/>
    </g>
    <!-- base letters -->
    <g class="mono" font-size="11" fill="#e2e8f0" opacity="0.85" text-anchor="middle">
      <text x="30" y="92">A</text><text x="30" y="236">T</text>
      <text x="60" y="80">C</text><text x="60" y="248">G</text>
      <text x="90" y="92">G</text><text x="90" y="236">C</text>
      <text x="150" y="92">T</text><text x="150" y="236">A</text>
      <text x="180" y="80">G</text><text x="180" y="248">C</text>
      <text x="210" y="92">A</text><text x="210" y="236">T</text>
      <text x="270" y="92">C</text><text x="270" y="236">G</text>
      <text x="300" y="80">T</text><text x="300" y="248">A</text>
      <text x="330" y="92">A</text><text x="330" y="236">T</text>
      <text x="390" y="92">G</text><text x="390" y="236">C</text>
      <text x="420" y="80">A</text><text x="420" y="248">T</text>
      <text x="450" y="92">C</text><text x="450" y="236">G</text>
    </g>
    <!-- neural nodes along the helix -->
    <g>
      <circle class="node"    cx="60"  cy="60"  r="5" fill="#22d3ee"/>
      <circle class="node d1" cx="180" cy="260" r="5" fill="#8b5cf6"/>
      <circle class="node d2" cx="300" cy="60"  r="5" fill="#34d399"/>
      <circle class="node d3" cx="420" cy="260" r="5" fill="#22d3ee"/>
      <circle class="node d4" cx="240" cy="160" r="4" fill="#e2e8f0"/>
      <circle class="node d2" cx="0"   cy="160" r="4" fill="#e2e8f0"/>
      <circle class="node d1" cx="480" cy="160" r="4" fill="#e2e8f0"/>
    </g>
    <!-- faint network links -->
    <g stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1">
      <line x1="60" y1="60" x2="240" y2="160"/>
      <line x1="300" y1="60" x2="240" y2="160"/>
      <line x1="180" y1="260" x2="240" y2="160"/>
      <line x1="420" y1="260" x2="240" y2="160"/>
      <line x1="60" y1="60" x2="300" y2="60"/>
      <line x1="180" y1="260" x2="420" y2="260"/>
    </g>
  </g>

  <!-- bottom rule -->
  <rect x="40" y="306" width="1120" height="2" fill="url(#rule)"/>
</svg>
