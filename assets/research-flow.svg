<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Research flow: DNA sequence → deep learning → single-cell chromatin accessibility → regulatory grammar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#0f1b3a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono","Fira Code","SFMono-Regular",Consolas,Menlo,monospace; }
      .sans { font-family: Inter,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Helvetica,Arial,sans-serif; }
      .cjk  { font-family: "PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif; }
      .flow { stroke-dasharray: 5 9; animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .pulse.d1 { animation-delay:.3s } .pulse.d2 { animation-delay:.6s } .pulse.d3 { animation-delay:.9s } .pulse.d4 { animation-delay:1.2s }
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      .cell { animation: cellpulse 3s ease-in-out infinite; }
      .cell.d1 { animation-delay:.5s } .cell.d2 { animation-delay:1s } .cell.d3 { animation-delay:1.5s } .cell.d4 { animation-delay:2s }
      @keyframes cellpulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    </style>
  </defs>

  <rect width="1200" height="250" rx="16" fill="url(#bg)"/>

  <!-- ===== Stage 1: DNA sequence ===== -->
  <g transform="translate(40,0)">
    <rect x="0" y="40" width="250" height="150" rx="12" fill="#0a1020" stroke="#1e293b"/>
    <text x="16" y="66" class="mono" font-size="11" fill="#64748b">INPUT · 1,344 bp</text>
    <g class="mono" font-size="15" font-weight="700">
      <text x="16" y="100"><tspan fill="#22d3ee">A</tspan><tspan fill="#34d399">T</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#34d399">T</tspan><tspan fill="#34d399">T</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#34d399">T</tspan></text>
      <text x="16" y="124"><tspan fill="#f472b6">G</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#34d399">T</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#34d399">T</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#34d399">T</tspan><tspan fill="#a78bfa">C</tspan></text>
      <text x="16" y="148"><tspan fill="#34d399">T</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#34d399">T</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#34d399">T</tspan><tspan fill="#22d3ee">A</tspan><tspan fill="#a78bfa">C</tspan><tspan fill="#34d399">T</tspan><tspan fill="#f472b6">G</tspan><tspan fill="#22d3ee">A</tspan></text>
    </g>
    <text x="16" y="176" class="sans" font-size="12" fill="#94a3b8">DNA sequence of an ACR</text>
    <text x="125" y="222" class="cjk" font-size="12" fill="#7c8aa5" text-anchor="middle">DNA 序列</text>
  </g>

  <!-- arrow 1 -->
  <g transform="translate(300,115)">
    <line x1="0" y1="0" x2="62" y2="0" stroke="url(#arrow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="62" y2="0" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.2" class="flow"/>
    <path d="M58 -6 L70 0 L58 6" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Stage 2: CNN ===== -->
  <g transform="translate(385,0)">
    <rect x="0" y="40" width="250" height="150" rx="12" fill="#0a1020" stroke="#1e293b"/>
    <text x="16" y="66" class="mono" font-size="11" fill="#64748b">MODEL · multitask CNN</text>
    <!-- layers -->
    <g>
      <g fill="#22d3ee">
        <circle class="pulse"    cx="40" cy="92"  r="5"/><circle class="pulse d1" cx="40" cy="116" r="5"/><circle class="pulse d2" cx="40" cy="140" r="5"/><circle class="pulse d3" cx="40" cy="164" r="5"/>
      </g>
      <g fill="#a78bfa">
        <circle class="pulse d2" cx="100" cy="98"  r="5"/><circle class="pulse d3" cx="100" cy="128" r="5"/><circle class="pulse d4" cx="100" cy="158" r="5"/>
      </g>
      <g fill="#a78bfa">
        <circle class="pulse d1" cx="160" cy="104" r="5"/><circle class="pulse d4" cx="160" cy="152" r="5"/>
      </g>
      <g fill="#34d399">
        <circle class="pulse d3" cx="220" cy="92"  r="5"/><circle class="pulse"    cx="220" cy="116" r="5"/><circle class="pulse d2" cx="220" cy="140" r="5"/><circle class="pulse d1" cx="220" cy="164" r="5"/>
      </g>
      <g stroke="#94a3b8" stroke-opacity=".28" stroke-width="1">
        <line x1="40" y1="92" x2="100" y2="98"/><line x1="40" y1="116" x2="100" y2="98"/><line x1="40" y1="140" x2="100" y2="128"/><line x1="40" y1="164" x2="100" y2="158"/>
        <line x1="40" y1="92" x2="100" y2="128"/><line x1="40" y1="164" x2="100" y2="128"/><line x1="40" y1="116" x2="100" y2="158"/>
        <line x1="100" y1="98" x2="160" y2="104"/><line x1="100" y1="128" x2="160" y2="104"/><line x1="100" y1="128" x2="160" y2="152"/><line x1="100" y1="158" x2="160" y2="152"/>
        <line x1="160" y1="104" x2="220" y2="92"/><line x1="160" y1="104" x2="220" y2="116"/><line x1="160" y1="152" x2="220" y2="140"/><line x1="160" y1="152" x2="220" y2="164"/>
        <line x1="160" y1="104" x2="220" y2="140"/><line x1="160" y1="152" x2="220" y2="116"/>
      </g>
    </g>
    <text x="125" y="222" class="cjk" font-size="12" fill="#7c8aa5" text-anchor="middle">深度学习模型 (PEAgent)</text>
  </g>

  <!-- arrow 2 -->
  <g transform="translate(645,115)">
    <line x1="0" y1="0" x2="62" y2="0" stroke="url(#arrow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="62" y2="0" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.2" class="flow"/>
    <path d="M58 -6 L70 0 L58 6" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Stage 3: single-cell accessibility ===== -->
  <g transform="translate(730,0)">
    <rect x="0" y="40" width="200" height="150" rx="12" fill="#0a1020" stroke="#1e293b"/>
    <text x="16" y="66" class="mono" font-size="11" fill="#64748b">OUTPUT · 320 cell types</text>
    <!-- heatmap grid 8x4 -->
    <g>
      <rect class="cell"    x="16"  y="82"  width="18" height="18" rx="3" fill="#f59e0b"/><rect class="cell d2" x="38" y="82" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d1" x="60" y="82" width="18" height="18" rx="3" fill="#fbbf24"/><rect class="cell d3" x="82" y="82" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d4" x="104" y="82" width="18" height="18" rx="3" fill="#334155"/><rect class="cell" x="126" y="82" width="18" height="18" rx="3" fill="#f59e0b"/><rect class="cell d2" x="148" y="82" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d1" x="170" y="82" width="14" height="18" rx="3" fill="#d97706"/>
      <rect class="cell d1" x="16"  y="104" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d3" x="38" y="104" width="18" height="18" rx="3" fill="#fbbf24"/><rect class="cell" x="60" y="104" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d4" x="82" y="104" width="18" height="18" rx="3" fill="#f59e0b"/><rect class="cell d2" x="104" y="104" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d1" x="126" y="104" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d3" x="148" y="104" width="18" height="18" rx="3" fill="#d97706"/><rect class="cell" x="170" y="104" width="14" height="18" rx="3" fill="#334155"/>
      <rect class="cell d2" x="16"  y="126" width="18" height="18" rx="3" fill="#334155"/><rect class="cell" x="38" y="126" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d4" x="60" y="126" width="18" height="18" rx="3" fill="#f59e0b"/><rect class="cell d1" x="82" y="126" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d3" x="104" y="126" width="18" height="18" rx="3" fill="#fbbf24"/><rect class="cell d2" x="126" y="126" width="18" height="18" rx="3" fill="#334155"/><rect class="cell" x="148" y="126" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d4" x="170" y="126" width="14" height="18" rx="3" fill="#f59e0b"/>
      <rect class="cell d3" x="16"  y="148" width="18" height="18" rx="3" fill="#d97706"/><rect class="cell d1" x="38" y="148" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d2" x="60" y="148" width="18" height="18" rx="3" fill="#334155"/><rect class="cell" x="82" y="148" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d4" x="104" y="148" width="18" height="18" rx="3" fill="#f59e0b"/><rect class="cell d3" x="126" y="148" width="18" height="18" rx="3" fill="#fbbf24"/><rect class="cell d1" x="148" y="148" width="18" height="18" rx="3" fill="#334155"/><rect class="cell d2" x="170" y="148" width="14" height="18" rx="3" fill="#334155"/>
    </g>
    <text x="16" y="182" class="sans" font-size="11" fill="#94a3b8">chromatin accessibility / cell type</text>
    <text x="100" y="222" class="cjk" font-size="12" fill="#7c8aa5" text-anchor="middle">单细胞染色质可及性</text>
  </g>

  <!-- arrow 3 -->
  <g transform="translate(940,115)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="url(#arrow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="42" y2="0" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.2" class="flow"/>
    <path d="M38 -6 L50 0 L38 6" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Stage 4: regulatory grammar ===== -->
  <g transform="translate(1005,0)">
    <rect x="0" y="40" width="155" height="150" rx="12" fill="#0a1020" stroke="#1e293b"/>
    <text x="16" y="66" class="mono" font-size="11" fill="#64748b">GRAMMAR</text>
    <!-- motif logo bars -->
    <g class="mono" font-weight="800" text-anchor="middle">
      <text x="30"  y="150" font-size="34" fill="#22d3ee">T</text>
      <text x="52"  y="150" font-size="22" fill="#a78bfa">C</text>
      <text x="74"  y="150" font-size="38" fill="#f472b6">G</text>
      <text x="96"  y="150" font-size="38" fill="#f472b6">G</text>
      <text x="118" y="150" font-size="26" fill="#34d399">A</text>
      <text x="138" y="150" font-size="18" fill="#22d3ee">T</text>
    </g>
    <line x1="14" y1="156" x2="146" y2="156" stroke="#334155" stroke-width="1"/>
    <text x="16" y="182" class="sans" font-size="11" fill="#94a3b8">motifs · synergy · variants</text>
    <text x="77" y="222" class="cjk" font-size="12" fill="#7c8aa5" text-anchor="middle">顺式调控语法</text>
  </g>
</svg>
